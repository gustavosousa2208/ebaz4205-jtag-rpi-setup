# Banana Pi M2 Zero native GPIO bit-bang adapter.
#
# The 40-pin header physical positions match the Raspberry Pi wiring layout,
# but this Allwinner H2+ SoC uses gpiochip0 offsets 64 through 67 for SPI0.
#
#   header 23 / PC2 / gpiochip0 line 66: TCK
#   header 24 / PC3 / gpiochip0 line 67: TMS
#   header 19 / PC0 / gpiochip0 line 64: TDI
#   header 21 / PC1 / gpiochip0 line 65: TDO
#   header 20: GND
#
# Do not connect either board's power rail.
adapter driver linuxgpiod
adapter gpio tck -chip 0 66
adapter gpio tms -chip 0 67
adapter gpio tdi -chip 0 64
adapter gpio tdo -chip 0 65

transport select jtag

# linuxgpiod/sysfsgpio report that adapter speed is not configurable. Keep
# this value as the conservative requested/display value until a rate-capable
# transport replaces the bit-bang backend.
adapter speed 100
