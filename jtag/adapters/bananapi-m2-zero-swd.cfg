# Banana Pi M2 Zero, second port: SWD to an MCU on Port A.
#
# Header 31 / PA8 / gpiochip0 line 8: SWCLK
# Header 33 / PA9 / gpiochip0 line 9: SWDIO
#   SWDIO is bidirectional; the driver re-requests this one line as input or output as the protocol
#   turns the bus around, so no separate direction pin is needed. A board with an external direction
#   buffer would add: adapter gpio swdio_dir -chip 0 <line>
# Header 7  / PA6 / line 6 and header 29 / PA7 / line 7 are free for NRST and SWO later.
# Common ground, and never bridge the two boards' power rails.
#
# These pins are not referenced by any device-tree pinctrl state and are requestable on the running
# board (checked 2026-10-10), so they belong to the header and nothing else.
#
# Used with the repository's MMIO runner, which is the build that contains linuxgpiod:
#   sudo /usr/local/libexec/openocd-ebaz-mmio \
#     -f ~/ebaz4205-jtag/jtag/adapters/bananapi-m2-zero-swd.cfg \
#     -f /path/to/target.cfg

adapter driver linuxgpiod
adapter gpio swclk -chip 0 8
adapter gpio swdio -chip 0 9

transport select swd
