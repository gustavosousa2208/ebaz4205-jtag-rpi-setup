# Banana Pi M2 Zero, second port: SWD to an MCU on Port A.
#
# Header 31 / PA8 / gpiochip0 line 8: SWCLK
# Header 33 / PA9 / gpiochip0 line 9: SWDIO
#   SWDIO is bidirectional; the driver re-requests this one line as input or output as the protocol
#   turns the bus around, so no separate direction pin is needed. A board with an external direction
#   buffer would add: adapter gpio swdio_dir -chip 0 <line>
# Header 7  / PA6 / gpiochip0 line 6: NRST  (drive via a 330 ohm series resistor)
# Header 29 / PA7 / gpiochip0 line 7: free, an input from the target, reserved for SWO trace later
#
# NRST: the driver drives this line push-pull (linuxgpiod_reset() sets a line value; it has no
# open-drain mode), while the MCU holds its own reset line high through an internal pull-up and pulls
# it low for its own resets. The series resistor is what keeps those two drivers from fighting: with
# 330 ohm the worst case is about 10 mA, and the target still sees a clean low because its pull-up is
# in the tens of kilo-ohms. Deassert drives the line high into that pull-up, which is harmless.
#
# reset_config srst_only: an STM32 has no TRST. Uncomment the second line to hold reset while
# connecting, which is what a target whose running firmware disables SWD needs.
#
# Common ground, and never bridge the two boards' power rails.
#
# These pins are not referenced by any device-tree pinctrl state and are requestable on the running
# board (checked 2026-10-10), so they belong to the header and nothing else.
#
# Used with the repository's MMIO runner, which is the build that contains linuxgpiod:
#   sudo /usr/local/libexec/openocd-ebaz-mmio \
#     -f ~/ebaz4205-jtag/jtag/adapters/bananapi-m2-zero-swd.cfg \
#     -f /path/to/target.cfg

adapter driver linuxgpiod
adapter gpio swclk -chip 0 8
adapter gpio swdio -chip 0 9
# srst is deliberately not enabled: without the series resistor a push-pull high from the probe can
# fight the MCU driving its own reset low. Uncomment the next line once the resistor is in place, and
# uncomment it together with reset_config below.
# adapter gpio srst -chip 0 6

transport select swd
# reset_config srst_only
# connect_assert_srst
