# Sipeed RV CMSIS-DAP. OpenOCD auto-detects its v2 USB bulk interface.
# Avoid newer cmsis-dap subcommands so this also works with macOS OpenOCD 0.12.
adapter driver cmsis-dap
if {[info exists ::env(EBAZ_CMSIS_DAP_SERIAL)]} {
    adapter serial $::env(EBAZ_CMSIS_DAP_SERIAL)
}
transport select jtag

# Conservative starting speed for direct wiring to the EBAZ4205.
adapter speed 1000
