# EBAZ4205 Zynq target. The adapter is selected separately by the launcher.
source [find target/zynq_7000.cfg]

# Keep the work area below the application at 0x10000. Only the first three
# 64 KiB OCM banks are mapped low after reset.
zynq.cpu0 configure -work-area-phys 0x00001000 \
    -work-area-size 0x0000E000 -work-area-backup 1
