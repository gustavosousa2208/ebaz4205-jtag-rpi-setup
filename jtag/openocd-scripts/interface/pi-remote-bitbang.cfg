# Host OpenOCD against an ebaz-xvc-server remote_bitbang endpoint.
#
# The endpoint is loopback-only at both ends: the probe binds 127.0.0.1 and the host reaches it through
# an authenticated SSH forward. Either open the forward yourself
#
#   ssh -N -L 4444:127.0.0.1:4444 gusta-bpi
#
# or let `piprobe openocd` open it, start the probe-side service and pass this file with -f.
#
# This file carries only the adapter and its endpoint; the transport and the TAP live in the target
# script, which is what lets one interface serve the EBAZ4205 (JTAG) and an MCU (SWD):
#
#   openocd -f interface/pi-remote-bitbang.cfg -f target/zynq_7000.cfg
#   openocd -f interface/pi-remote-bitbang.cfg -f target/stm32-swd.cfg
#
# RBB_HOST and RBB_PORT can be preset on the command line before this file is read, which is how
# `piprobe openocd` points it at a forwarded port other than 4444.

if { ![info exists RBB_HOST] } { set RBB_HOST 127.0.0.1 }
if { ![info exists RBB_PORT] } { set RBB_PORT 4444 }

adapter driver remote_bitbang
remote_bitbang host $RBB_HOST
remote_bitbang port $RBB_PORT
