# Generic STM32 (Cortex-M) over SWD, for the probe's SWD mode.
#
# Pair it with an interface script that selects the transport bits, then run:
#
#   openocd -f interface/pi-remote-bitbang.cfg -f target/stm32-swd.cfg \
#           -c "init; dap info 0; targets; halt; reg pc; resume; shutdown"
#
# The probe side then needs SWD, not JTAG: the server is started with `--swd CLK,DIO` (and with
# `--nrst LINE` only when the reset wire has its series resistor). The wiring table, including that
# resistor, is in jtag/adapters/bananapi-m2-zero-swd.cfg.
#
# Nothing here is part-specific: the DP IDCODE decides which STM32 answered, so the same script
# attaches to an F1 or F4 (Cortex-M3/M4, DP 0x2ba01477), an F0 or L0 (M0+, DP 0x0bb11477), an F7 or H7
# (M7) and so on. Set CPUTAPID before this file to require one specific DP, and add the part's flash
# driver (e.g. stm32f1x, stm32l4x) only when the session has to program the target.
#
# reset_config none is deliberate: the probe drives NRST only when the server was started with --nrst,
# and an attach has no business toggling the target's reset. Enable srst here once the series resistor
# is in place and the session actually needs reset control.

transport select swd

if { ![info exists CPUTAPID] } {
	# 0 disables OpenOCD's ID check, so any Cortex-M DP may answer.
	set _CPUTAPID 0
} else {
	set _CPUTAPID $CPUTAPID
}

set _CHIPNAME stm32
set _TARGETNAME $_CHIPNAME.cpu

swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
# '-chain-position' is what the rest of this directory uses: newer OpenOCD builds warn that '-tap'
# will replace it, xPack 0.12.0-7 (the build the host runs) does not understand '-tap' at all.
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# reset_config srst_only: the probe drives NRST only when its server was started with --nrst LINE (and
# the wire has the series resistor). Declaring it here drives nothing by itself -- OpenOCD asserts srst
# for an explicit reset command -- and without --nrst the server refuses every reset request instead of
# pretending. srst_push_pull matches what the probe does: it drives the line, it does not open-drain it.
#
# The knob for a target whose firmware reuses the SWD pins after boot, which shows up as
# "Error connecting DP: cannot read IDR", is connect_assert_srst: it holds NRST low while connecting,
# so the debug port is examined before that firmware starts. Pass it before init:
#
#   -c connect_assert_srst -c init
reset_config srst_only srst_push_pull
