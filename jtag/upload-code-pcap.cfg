source $::env(EBAZ_BUNDLE_DIR)/xsa/openocd-xilinx-compat.tcl
source $::env(EBAZ_BUNDLE_DIR)/xsa/ps7_init.tcl
source $::env(EBAZ_BUNDLE_DIR)/pl-program.tcl

proc ebaz_pcap_fail {message} {
    echo "PCAP_RESULT: FAIL - $message"
    shutdown error
}

proc ebaz_pcap_program {image} {
    set byte_count [file size $image]
    if {$byte_count == 0 || ($byte_count % 4) != 0} {
        ebaz_pcap_fail "PCAP image size must be a positive multiple of four"
    }

    set stage_start [clock milliseconds]
    echo "Staging PCAP image in DDR and verifying with target CRC..."
    if {[catch {load_image $image 0x00100000 bin} message]} {
        ebaz_pcap_fail "DDR staging failed: $message"
    }
    set stage_ms [expr {[clock milliseconds] - $stage_start}]

    set verify_start [clock milliseconds]
    if {[catch {verify_image_checksum $image 0x00100000 bin} message]} {
        ebaz_pcap_fail "target-side CRC verification failed: $message"
    }
    set verify_ms [expr {[clock milliseconds] - $verify_start}]
    set words [expr {$byte_count / 4}]
    echo "PCAP staging verified: bytes=$byte_count stage_ms=$stage_ms crc_ms=$verify_ms"

    # Match the tested FSBL-style DevCfg/PCAP sequence. FPGA resets remain
    # asserted and the level shifters remain closed until PCFG_DONE and INIT_B.
    mww 0xF8007034 0x757BDF0D
    set ctrl [lindex [read_memory 0xF8007000 32 1] 0]
    set ctrl [expr {$ctrl | 0x0C000000}]
    mww 0xF8007000 $ctrl
    mww 0xF8007000 [expr {$ctrl & ~0x40000000}]
    sleep 50
    mww 0xF8007000 [expr {$ctrl | 0x40000000}]
    sleep 100
    mww 0xF800700C 0xFFFFFFFF
    mww 0xF8007018 0x00100001
    mww 0xF800701C 0xFFFFFFFF
    mww 0xF8007020 $words
    mww 0xF8007024 $words

    set done 0
    for {set i 0} {$i < 200} {incr i} {
        set int_sts [lindex [read_memory 0xF800700C 32 1] 0]
        if {$int_sts & 0x4} {
            set done 1
            break
        }
        sleep 100
    }
    set int_sts [lindex [read_memory 0xF800700C 32 1] 0]
    set status [lindex [read_memory 0xF8007014 32 1] 0]
    echo [format "PCAP DevCfg: INT_STS=0x%08x STATUS=0x%08x" $int_sts $status]
    if {!$done} {
        ebaz_pcap_fail "PCFG_DONE not set; level shifters remain closed"
    }
    if {($status & 0x10) == 0} {
        ebaz_pcap_fail "INIT_B is low; bitstream rejected and level shifters remain closed"
    }

    mww 0xF8000008 0x0000DF0D
    mww 0xF8000900 0x0000000F
    mww 0xF8000240 0x00000000
    mww 0xF8000004 0x0000767B
    echo "PCAP_RESULT: PL configured; PCFG_DONE=1 INIT_B=1"
}

set upload_start [clock milliseconds]
init
targets zynq.cpu0
halt

# Cortex-A defaults to 80 TCK of delay for each AP access. Eight clocks avoids
# the WAIT retries seen at zero while keeping the PCAP path within its target.
adapter speed 1000
zynq.dap memaccess 4

if {$::env(EBAZ_LOAD_BITSTREAM) eq "1"} {
    echo "Initializing Zynq PS from the matching XSA..."
    ps7_init
    ebaz_pcap_program $::env(EBAZ_PCAP_BIN)
}

echo "Loading the application ELF..."
set elf_start [clock milliseconds]
load_image $::env(EBAZ_ELF)
verify_image $::env(EBAZ_ELF)
set elf_ms [expr {[clock milliseconds] - $elf_start}]

target smp zynq.cpu0
targets zynq.cpu0
resume $::env(EBAZ_ENTRY)
echo "Application started at $::env(EBAZ_ENTRY)"
ebaz_mark_upload_success
echo "PCAP_RESULT: OK elf_ms=$elf_ms total_ms=[expr {[clock milliseconds] - $upload_start}]"
targets
