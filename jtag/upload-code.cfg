source $::env(EBAZ_BUNDLE_DIR)/xsa/openocd-xilinx-compat.tcl
source $::env(EBAZ_BUNDLE_DIR)/xsa/ps7_init.tcl

init
targets zynq.cpu0
halt

echo "Initializing Zynq PS from the matching XSA..."
ps7_init

echo "Programming the FPGA bitstream..."
pld load zynq_pl.pld $::env(EBAZ_BITSTREAM)
ps7_post_config

echo "Loading the application ELF..."
load_image $::env(EBAZ_ELF)
verify_image $::env(EBAZ_ELF)

echo "UART1 MIO24/MIO25 configuration:"
mdw 0xF8000760 2
echo "UART1 control/mode/baud/status registers:"
mdw 0xE0001000 14
# Detach CPU1 from the SMP group before starting CPU0. Otherwise OpenOCD's
# target teardown can leave the application core halted when the process exits.
target smp zynq.cpu0
targets zynq.cpu0
resume $::env(EBAZ_ENTRY)
echo "Application started at $::env(EBAZ_ENTRY)"
targets
